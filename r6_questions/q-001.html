</style></head><body><main><p class="question-start" id="r6q1"><strong>問1 次は、下水道法に規定する公共下水道の使用料を定める場合の原則につ いて述べたものです。最も不適切なものはどれですか。</strong></p>
<p>(1) 能率的な管理の下における適正な原価をこえないものであること。<br/>
(2) 他の公共料金と比較して著しく高額とならないよう定めること。<br/>
(3) 定率又は定額をもって明確に定められていること。<br/>
(4) 特定の使用者に対し不当な差別的取扱をするものでないこと。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
