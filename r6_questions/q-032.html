</style></head><body><main><p class="question-start" id="r6q32"><strong>問32 嫌気無酸素好気法における各タンクについて述べたものです。最も不適切なものはどれですか。</strong></p>
<p>（１） 好気的条件とは酸素が存在する条件をいう。<br/>
（２） 無酸素状態とは、溶存酸素が存在しないが、硝酸・亜硝酸が存在する状態をいう。<br/>
（３） 嫌気状態とは、酸素も硝酸・亜硝酸も存在しない状態をいう。<br/>
（４） 好気的条件下では、独立栄養生物により脱窒反応が進行する。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
