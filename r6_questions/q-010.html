<p>A系列、B系列の沈殿池に5:4の水量比で下水が流入している。このときのA系列、B系列のそれぞれの水面積負荷の値a、bの比率a/bは1に等しかった。<br/>
次に、A系列、B系列に流入する下水の水量比が5:5に変わった場合、A系列、B系列のそれぞれの水面積負荷の値a ́、b ́の比率a ́/b ́は( )になる。</p>
<p><img alt="" class="alignnone wp-image-648 size-medium" height="170" sizes="(max-width: 300px) 100vw, 300px" src="../r6_assets/img-001.png" width="300"/></p>

(2) 4/5<br/>
(3) 5/4<br/>
(4) 3/2</p>
