<p>（１） 最初沈殿池を設けない処理方式である。<br/>
（２） 主に機械式エアレーション装置を有する無終端水路を反応タンクとして、高BOD-SS負荷で活性汚泥処理を行う。<br/>
（３） 固形物滞留時間（SRT）が⾧いために、硝化が進行する。<br/>
（４） 処理水のpHに留意して運転を行う必要がある。</p>
