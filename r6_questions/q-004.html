<p>(1) 終末処理場の用地取得完了の予定年月日<br/>
(2) 排水施設の配置、構造及び能力並びに点検の方法及び頻度<br/>
(3) 終末処理場以外の処理施設を設ける場合には、その配置、構造及び能力<br/>
(4) 工事の着手及び完成の予定年月日</p>
