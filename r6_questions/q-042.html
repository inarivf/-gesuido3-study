<p>（１） 流量計の実校正は、ポンプの規定吐出量と比較する。<br/>
（２） 温度計や圧力計は、試験用測定器との置換えが比較的容易なので、試験用測定器のデータとの比較を行う。<br/>
（３） 水質計器は、手分析値との比較を行うとともに、手分析値のデータは、以後の校正の参考となるので保存しておく。<br/>
（４） レベル計（水位計、液位計）の実校正は、レベル計の近くに基準レベルを設けておき、スケール等で実測比較する。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
