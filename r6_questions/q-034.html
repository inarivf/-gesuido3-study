<p>（１） プロペラ型は、かくはんと混合を散気板により行い、酸素の供給は水中のプロペラで行う。<br/>
（２） 軸流ポンプ型は、軸流インペラのかくはんと、散気管からの空気吸込みを組合せたものである。<br/>
（３） スクリュー型は、スクリューの回転による負圧を利用して空気を自給する。<br/>
（４） 縦軸型は、反応タンクの水面上において浸漬されているインペラによる表面エアレーション方式である。</p>
