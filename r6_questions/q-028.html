<p>（１） 多量の浮遊性有機物が下水管きょに流入すると、管底に堆積し、管きょを閉塞させることがある。<br/>
（２） 排水の溶解性有機物負荷量が高いと、下水処理場では、最初沈殿池の沈殿汚泥量が増加し、汚泥処理の負担が増す。<br/>
（３） 排出源として、食料品製造業、繊維工業、パルプ・紙・紙加工品製造業などがある。<br/>
（４） 処理方法として、活性汚泥法などの生物処理法がある。</p>
