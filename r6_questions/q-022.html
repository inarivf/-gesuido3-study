</style></head><body><main><p class="question-start" id="r6q22"><strong>問22 汚泥の重力濃縮について述べたものです。最も不適切なものはどれですか。</strong></p>
<p>（１） 重力濃縮タンクの固形物負荷は、60～90kg-DS/（m²・日）程度とする。<br/>
（２） 汚泥の腐敗が起こる夏期には、汚泥の濃縮性が低下する傾向にある。<br/>
（３） 投入汚泥の固形物濃度は、汚泥の沈降速度に影響し、濃度が高いほど汚泥の沈降分離、濃縮性が悪化する傾向にある。<br/>
（４） 投入汚泥の余剰汚泥混入率が低いほど、汚泥の沈降分離、濃縮性が悪化する傾向にある。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
