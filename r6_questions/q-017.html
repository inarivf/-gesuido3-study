<p>(1) 水理学的滞留時間(HRT)は、流入きょから放流きょまでの平均的な時間を表す。<br/>
(2) 固形物滞留時間(SRT)は、処理システムの系内における活性汚泥 (固形物)の平均滞留時間を意味する。<br/>
(3) 単位反応タンク容積で1日当たり処理するBOD量で表したものが、BOD容積負荷である。<br/>
(4) 単位反応タンク内の汚泥量が1日当たり処理するBOD量で表したものが、BOD―SS負荷である。</p>
