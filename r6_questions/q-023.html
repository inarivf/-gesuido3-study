</style></head><body><main><p class="question-start" id="r6q23"><strong>問23 汚泥を脱水するための汚泥の調質について述べたものです。最も不適切なものはどれですか。</strong></p>
<p>（１） 汚泥粒子表面は、正に帯電しているが、負の電荷をもつ凝集剤を添加すると、電気的中和が生じて粒子同士の凝集が促進される。<br/>
（２） 凝集剤には、無機凝集剤と高分子凝集剤がある。<br/>
（３） 高分子凝集剤の添加率は、無機凝集剤と比べると非常に少ないため、脱水汚泥を焼却したり処分する際にも有利である。<br/>
（４） 高分子凝集剤には、カチオン性ポリマ、アニオン性ポリマ、ノニオン性ポリマ、両性ポリマがある。</p>
