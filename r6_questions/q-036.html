<p>（１） 水中部分については、年1回程度定期的に池を空にして点検することが望ましい。<br/>
（２） 減速機の潤滑油は、年1回程度交換し、適宜、不足分を補充する。<br/>
（３） 回転式汚泥かき寄せ機における走行中のノッキング（しゃっくり現象）は、走行車輪の取付け方向等の機構上に起因する場合がある。<br/>
（４） チェーンフライト式汚泥かき寄せ機の水上及び水中部の軸受部は、給油方式の場合、年1回グリスを充填する。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
