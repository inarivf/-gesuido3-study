<p>(1) 溶存オゾン濃度と接触時間との積が大きいほど消毒効果が大きい。<br/>
(2) 下水処理水では、オゾン注入率は50mg/L程度を標準とする。<br/>
(3) オゾン反応タンクからの未反応のオゾンを処理するため、排オゾン処理設備を設ける。<br/>
(4) 下水処理水中に含まれるSSや亜硝酸性窒素はオゾン消毒効果を低下させる。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
