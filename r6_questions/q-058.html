</style></head><body><main><p class="question-start" id="r6q58"><strong>問58 次は、下水道施設で発生する硫化水素について述べたものです。最も不適切なものはどれですか。</strong></p>
<p>（１） 硫化水素は、下水や汚泥中において溶存酸素がない条件下で硫酸イオンが還元されることにより発生する。<br/>
（２） 下水道施設内には、直ちに死に至るような高濃度の硫化水素が発生する箇所はない。<br/>
（３） 硫化水素は、無色で濃度が低い時は腐卵臭のあるガスである。<br/>
（４） 処理場等の施設では、沈砂池、ポンプ井、最初沈殿池、汚泥濃縮タンク等で発生することが多い。</p>
