<p>反応タンクの活性汚泥の汚泥容量指標(SVI)が高く、沈降性が低下する場合は、最初沈殿池の運転池数を( A )ことで水面積負荷を( B )し、活性汚泥の沈降性を高めるのに必要なSSを( C )へ流出させることがある。</p>
<p>A B C<br/>
(1) 増やす 大きく 最終沈殿池<br/>
(2) 減らす 小さく 反応タンク<br/>
(3) 減らす 大きく 反応タンク<br/>
(4) 増やす 小さく 最終沈殿池</p>
