<p>[水処理施設] [異常現象] [原因]<br/>
(1) 反応タンク 異常発泡 硫化物の蓄積<br/>
(2) 最終沈殿池 正常な活性汚泥の流出 水面積負荷の過大<br/>
(3) 最終沈殿池 汚泥の浮上 過剰な汚泥引抜き<br/>
(4) 消毒設備 放流先での魚の浮上 塩素接触時間が長い</p>
