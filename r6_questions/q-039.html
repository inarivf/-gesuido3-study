</style></head><body><main><p class="question-start" id="r6q39"><strong>問39 消毒用の次亜塩素酸ナトリウム溶液の性質について述べたものです。最も適切なものはどれですか。</strong></p>
<p>（１） 一般に市販されているものは、有効塩素が30％程度の水溶液で、外観が青緑色の透明な液体である。<br/>
（２） アルカリ性であり、酸化作用はなく、金属類や天然繊維類を腐食させることはない。<br/>
（３） 次亜塩素酸ナトリウム溶液に酸が添加されると、急激に分解反応が生じ、炭酸ガスが発生する。<br/>
（４） 常温でも不安定で保存中に徐々に分解して酸素を発生する。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
