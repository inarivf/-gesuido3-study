</style></head><body><main><p class="question-start" id="r6q31"><strong>問31 鉄粉法について述べたものです。最も不適切なものはどれですか。</strong></p>
<p>（１） 鉄粉法は、酸性条件下（pH3～4）の排水に鉄粉を加えかくはんしたのち、アルカリ条件下（pH9～10）で凝集沈殿する方法である。<br/>
（２） 鉄粉法は、鉄よりもイオン化傾向が低い重金属類に有効である。<br/>
（３） 鉄粉法は、複数の重金属類の一括処理が可能である。<br/>
（４） 鉄粉法は、処理水量に比較して汚泥発生量が少ない。</p>
<div class='source'>令和6年度 第50回 下水道技術検定 第3種 実問題。保存アーカイブより収録。</div></main></body></html>
