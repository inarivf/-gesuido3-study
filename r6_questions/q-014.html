<p>(1) 急速ろ過法による直接的な効果は、溶解性有機物濃度の低下である。<br/>
(2) りんの除去を目的とした水処理方法と併用することで、りんの除去を安定化させることが期待できる。<br/>
(3) ろ過圧の確保方法により、重力式と圧力式に分類される。<br/>
(4) 移床型ろ過は、ろ過を行いながら同時に連続してろ材の洗浄を行うため、ろ過水を連続して得ることができる。</p>
