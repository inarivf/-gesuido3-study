name: Patch official R7 viewer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-official-r7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch site
        run: python3 scripts/patch_site.py

      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Show official R7 exam pages as local images"
          git push
