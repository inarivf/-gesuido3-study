name: Build multi-year study site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-site.yml'
      - 'scripts/patch_multi_year.py'
      - 'r6_meta.json'
      - 'r6_archive.html'
      - 'r7_page_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: python3 scripts/patch_multi_year.py
      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add R6 real exam year switch"
          git push
