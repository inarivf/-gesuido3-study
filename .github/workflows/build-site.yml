name: Build and validate study site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-site.yml'
      - 'site_template.html'
      - 'r7_meta.json'
      - 'r6_meta.json'
      - 'r3_meta.json'
      - 'r2_meta.json'
      - 'r2_import_audit.json'
      - 'r2_source_excerpt.txt'
      - 'r6_build_audit.json'
      - 'r6_archive.html'
      - 'r7_mondai_3syu_official.pdf'
      - 'r7_pages/**'
      - 'scripts/build_question_views.py'
      - 'scripts/build_site.py'
      - 'scripts/validate_site.py'
      - 'scripts/test_trainer_ui.js'

permissions:
  contents: write

concurrency:
  group: gesuido3-site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install view builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --quiet beautifulsoup4 pillow

      - name: Build one-question views
        run: python3 scripts/build_question_views.py

      - name: Build v1.6
        run: python3 scripts/build_site.py

      - name: Validate 240 questions and one-question views
        run: python3 scripts/validate_site.py

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          parts=re.findall(r"<script>([\s\S]*?)</script>",s)
          if len(parts)!=1:
              raise SystemExit(f"expected 1 script block, got {len(parts)}")
          Path(".site-check.js").write_text(parts[0],encoding="utf-8")
          PY
          node --check .site-check.js
          rm .site-check.js

      - name: Test study, review and mock interactions
        run: node scripts/test_trainer_ui.js

      - name: Commit generated site and views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site_manifest.json r7_questions r6_questions r7_question_map.json question_view_audit.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build 下3 trainer v1.6 priority and resumable mock"
          git pull --rebase origin main
          git push
