name: Build R6 real exam archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-r6.yml'
      - 'scripts/build_r6_archive.py'
      - 'r6_meta.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: python3 -m pip install --quiet requests beautifulsoup4

      - name: Build R6 archive
        run: python3 scripts/build_r6_archive.py

      - name: Commit generated R6 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add r6_archive.html r6_assets r6_build_audit.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add R6 real exam archive"
          git push
